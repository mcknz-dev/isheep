
<!-- MOBILE MENU -->

<div class="mobile-menu hidden" id="mobileMenu">

    <!-- MOBILE SEARCH -->
    <div class="mobile-search-wrap">

        <i class="fa-solid fa-magnifying-glass mobile-search-icon"></i>

        <input
                type="text"
                class="mobile-search-input"
                id="mobileSearchInput"
                placeholder="Search news..."
                autocomplete="off"
        >

        <button
                class="search-clear hidden"
                id="mobileSearchClear"
                type="button"
        >
            ×
        </button>

    </div>

    <!-- LIBRARY -->
    <div class="mobile-section">

        <button class="mobile-row active" data-category="All" type="button">
            <i class="fa-solid fa-newspaper"></i>
            <span>All News</span>
        </button>

        <button class="mobile-row" data-category="Today" type="button">
            <i class="fa-regular fa-calendar"></i>
            <span>Today</span>
        </button>

        <button class="mobile-row" data-category="Read Later" type="button">
            <i class="fa-regular fa-bookmark"></i>
            <span>Saved</span>
        </button>

    </div>

    <!-- EXPLORE -->
    <div class="mobile-section">

        <button class="mobile-row" type="button">
            <i class="fa-brands fa-apple"></i>
            <span>Apple</span>
        </button>

        <button class="mobile-row" type="button">
            <i class="fa-solid fa-mobile-screen-button"></i>
            <span>iPhone</span>
        </button>

        <button class="mobile-row" type="button">
            <i class="fa-solid fa-laptop"></i>
            <span>Mac</span>
        </button>

        <button class="mobile-row" type="button">
            <i class="fa-solid fa-tablet-screen-button"></i>
            <span>iPad</span>
        </button>

        <button class="mobile-row" type="button">
            <i class="fa-regular fa-clock"></i>
            <span>Apple Watch</span>
        </button>

        <button class="mobile-row" type="button">
            <i class="fa-solid fa-vr-cardboard"></i>
            <span>Vision</span>
        </button>

        <button class="mobile-row" type="button">
            <i class="fa-solid fa-cloud"></i>
            <span>Services</span>
        </button>

    </div>

    <!-- ACTIONS -->
    <div class="mobile-section">

        <button class="mobile-row" id="mobileDarkToggle" type="button">
            <span id="mobileDarkLabel">Dark Mode</span>
            <i class="fa-solid fa-moon mobile-row-icon" id="mobileDarkIcon"></i>
        </button>

        <button class="mobile-row" id="mobileViewToggleRow" type="button">
            <span id="mobileViewLabel">Compact View</span>
            <i class="fa-solid fa-grip mobile-row-icon" id="mobileViewIcon"></i>
        </button>

        <button class="mobile-row" id="mobileSettings" type="button">
            <span>News sources</span>
            <i class="fa-solid fa-rss mobile-row-icon"></i>
        </button>

        <button class="mobile-row" id="mobileContact" type="button">
            <span>About iSheep</span>
            <i class="fa-regular fa-circle-question mobile-row-icon"></i>
        </button>

    </div>

    <!-- FOOTER -->
    <p class="mobile-footer">
        © 2026 iSheep.news · MCKNZ.DEV
    </p>

</div>
