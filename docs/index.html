
<style>
    @import url('https://fonts.googleapis.com/css2?family=Michroma&family=Orbitron:wght@400;500;600;700&display=swap');

    /* =========================================
       MAINTENANCE SCREEN
    ========================================= */

    .maintenance-screen,
    .maintenance-screen * {
        box-sizing: border-box;
    }

    .maintenance-screen {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        isolation: isolate;
        font-family: "Inter", sans-serif;
        background: transparent;
        color: #30313a;
    }

    /* =========================================
       ANIMATED BACKGROUND
    ========================================= */

    .maintenance-atmosphere {
        position: absolute;
        inset: -35%;
        z-index: -3;
        pointer-events: none;
        background:
                radial-gradient(ellipse at 18% 25%, rgba(255,255,255,.65), transparent 35%),
                radial-gradient(ellipse at 75% 20%, rgba(120,125,140,.20), transparent 38%),
                radial-gradient(ellipse at 80% 80%, rgba(255,255,255,.45), transparent 35%),
                radial-gradient(ellipse at 25% 85%, rgba(105,110,125,.20), transparent 40%),
                linear-gradient(135deg, #d9dbe1, #bfc2cb 55%, #d4d6dc);
        filter: blur(55px);
        animation: maintenanceDrift 32s ease-in-out infinite alternate;
    }

    .maintenance-atmosphere::after {
        content: "";
        position: absolute;
        inset: 5%;
        background:
                radial-gradient(ellipse at 50% 45%, rgba(255,255,255,.35), transparent 45%),
                radial-gradient(ellipse at 10% 70%, rgba(90,95,110,.12), transparent 35%);
        filter: blur(65px);
        animation: maintenanceDriftSecondary 40s ease-in-out infinite alternate;
    }

    @keyframes maintenanceDrift {
        0% {
            transform: translate3d(-2%, -1%, 0) scale(1);
        }
        50% {
            transform: translate3d(2%, 2%, 0) scale(1.06);
        }
        100% {
            transform: translate3d(-1%, 3%, 0) scale(1.02);
        }
    }

    @keyframes maintenanceDriftSecondary {
        0% {
            transform: translate3d(2%, 1%, 0) scale(1);
        }
        100% {
            transform: translate3d(-3%, -2%, 0) scale(1.08);
        }
    }

    /* =========================================
       GHOST WORKSPACE OUTLINES
    ========================================= */

    .maintenance-workspace {
        position: absolute;
        inset: 4.5% 1.3% 3%;
        z-index: -2;
        display: grid;
        grid-template-columns: minmax(145px, .72fr) minmax(0, 3fr) minmax(190px, 1fr);
        gap: 16px;
        opacity: .58;
        pointer-events: none;
    }

    .ghost-pane {
        min-width: 0;
        border: 1px solid rgba(255,255,255,.52);
        border-radius: 24px;
        background: rgba(255,255,255,.025);
    }

    .ghost-news {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px;
        padding: 12px;
    }

    .ghost-news-column {
        display: flex;
        flex-direction: column;
        gap: 10px;
    }

    .ghost-card {
        flex: 1;
        min-height: 100px;
        border: 1px solid rgba(255,255,255,.42);
        border-radius: 17px;
        background: rgba(255,255,255,.025);
    }

    .ghost-card:first-child {
        flex: 1.15;
    }

    .ghost-community {
        display: flex;
        flex-direction: column;
        gap: 12px;
        padding: 12px;
    }

    .ghost-community-card {
        flex: 1;
        min-height: 100px;
        border: 1px solid rgba(255,255,255,.42);
        border-radius: 15px;
        background: rgba(255,255,255,.025);
    }

    /* =========================================
       FOREGROUND GLASS CARD
    ========================================= */

    .maintenance-card {
        position: relative;
        z-index: 1;
        width: min(580px, calc(100% - 40px));
        min-height: 330px;
        padding: 58px 40px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 46px;

        border: 1px solid rgba(255,255,255,.9);
        border-radius: 27px;

        background: rgba(238,239,244,.48);
        backdrop-filter: blur(35px) saturate(135%);
        -webkit-backdrop-filter: blur(35px) saturate(135%);

        box-shadow:
                0 20px 65px rgba(50,53,65,.10),
                inset 0 1px 1px rgba(255,255,255,.65);
    }

    /* =========================================
       LOGO AND WORDMARK
    ========================================= */

    .maintenance-brand {
        position: relative;
        width: min(340px, 100%);
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .maintenance-logo {
        display: block;
        width: 100%;
        height: auto;
        object-fit: contain;
    }

    .maintenance-wordmark {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);

        margin: 0;
        color: #fff;

        font-family: "Michroma", sans-serif !important;
        font-size: clamp(19px, 3vw, 27px);
        font-weight: 400;
        letter-spacing: 1.5px;
        white-space: nowrap;

        text-shadow: 0 1px 5px rgba(40,40,50,.16);
    }

    /* =========================================
       UPDATE MESSAGE
    ========================================= */

    .maintenance-title {
        margin: 0;
        color: #30313a;

        font-family: "Orbitron", sans-serif !important;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 2.5px;
        line-height: 1.6;
        text-align: center;
        text-transform: uppercase;
    }

    /* =========================================
       RESPONSIVE
    ========================================= */

    @media (max-width: 700px) {
        .maintenance-workspace {
            inset: 3% 2%;
            grid-template-columns: 1fr;
        }

        .ghost-sidebar,
        .ghost-community {
            display: none;
        }

        .ghost-news {
            grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .ghost-news-column:last-child {
            display: none;
        }

        .maintenance-card {
            min-height: 280px;
            padding: 45px 25px;
            gap: 38px;
        }

        .maintenance-brand {
            width: min(290px, 100%);
        }

        .maintenance-title {
            font-size: 10px;
            letter-spacing: 2px;
        }
    }

    @media (prefers-reduced-motion: reduce) {
        .maintenance-atmosphere,
        .maintenance-atmosphere::after {
            animation: none;
        }
    }
</style>

<div class="maintenance-screen">

    <div class="maintenance-atmosphere"></div>

    <!-- Background workspace silhouette -->
    <div class="maintenance-workspace">

        <div class="ghost-pane ghost-sidebar"></div>

        <div class="ghost-pane ghost-news">
            <div class="ghost-news-column">
                <div class="ghost-card"></div>
                <div class="ghost-card"></div>
            </div>

            <div class="ghost-news-column">
                <div class="ghost-card"></div>
                <div class="ghost-card"></div>
            </div>

            <div class="ghost-news-column">
                <div class="ghost-card"></div>
                <div class="ghost-card"></div>
            </div>
        </div>

        <div class="ghost-pane ghost-community">
            <div class="ghost-community-card"></div>
            <div class="ghost-community-card"></div>
            <div class="ghost-community-card"></div>
        </div>

    </div>

    <!-- Main maintenance card -->
    <main class="maintenance-card">

        <div class="maintenance-brand">
            <img
                    class="maintenance-logo"
                    src="/docs/assets/homepage/sheep.png"
                    alt="iSheep logo"
            />

            <h1 class="maintenance-wordmark">iSheep+</h1>
        </div>

        <p class="maintenance-title">
            Update in Progress
        </p>

    </main>

</div>
